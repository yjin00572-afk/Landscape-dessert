interface:
  display_name: Edible Miniature Scene Dessert
  short_description: Turn images into luxury edible miniature dessert worlds
  default_prompt: Use $dessert-cutout-from-image to transform my uploaded image into
    a premium edible miniature scene presented as a high-end plated dessert or sculptural
    entremet. Preserve the original subject, environmental context, spatial relationships,
    color palette, lighting, atmosphere, and recognizable secondary details. Reconstruct
    the complete scene using realistic mousse, mirror glaze, translucent gel, chocolate,
    sugar work, tuile, crumble, and other believable pastry materials. Adapt scene
    density to the source image, maintain refined plating, and avoid isolated props
    or toy-like models. Read the bundled target-style guide and use the best matching
    style-reference image when supported.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
